    IntentLocation:
      description: Describes the location of a runtime object.
      type: object
      properties:
        gps:
          $ref: "#/components/schemas/Gps"
        address:
          $ref: "#/components/schemas/Address"
    FulfillmentLocation:
      description: Describes the location of a runtime object.
      type: object
