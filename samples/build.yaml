        descriptor:
          $ref: "#/components/schemas/FulfillmentDescriptor"
        gps:
          $ref: "#/components/schemas/Gps"
        address:
          $ref: "#/components/schemas/Address"
        location:
          $ref: "#/components/schemas/Location"
    TrackLocation:
      description: Describes the location of a runtime object.
      type: object
      properties:
        id:
          type: string
        gps:
