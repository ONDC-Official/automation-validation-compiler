        state:
          type: string
        provider:
          type: object
          properties:
            id:
              $ref: "#/components/schemas/Provider/properties/id"
            locations:
              type: array
              maxItems: 1
              items:
                type: object
                properties:
                  id:
                    $ref: "#/components/schemas/Location/properties/id"
            creds:
              type: array
              items:
                type: object
                properties:
                  descriptor:
                    type: object
                    properties:
                      code:
                        type: string
                      short_desc:
                        type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        offers:
          type: array
          items:
            $ref: "#/components/schemas/Offer"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        billing:
          $ref: "#/components/schemas/Billing"
        fulfillments:
          type: array
          items:
            $ref: "#/components/schemas/OrderFulfillment"
        cancellation_terms:
          description: >-
            The cancellation terms of this order. This can be overriden at the
            item level cancellation terms.
          type: array
